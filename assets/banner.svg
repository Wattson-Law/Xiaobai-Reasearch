<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bannerWave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="bannerStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Crisp Minimalist White Card with Subtle Border -->
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle Background Smooth Spline Wave -->
  <path d="M 2 260 C 260 240, 420 155, 680 185 C 910 210, 1040 125, 1198 140 L 1198 318 L 2 318 Z" fill="url(#bannerWave1)"/>
  <path d="M 2 260 C 260 240, 420 155, 680 185 C 910 210, 1040 125, 1198 140" fill="none" stroke="url(#bannerStroke)" stroke-width="2.2" opacity="0.35"/>
  <path d="M 2 285 C 310 265, 540 220, 820 235 C 990 245, 1100 190, 1198 195" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5,5" opacity="0.35"/>

  <!-- Top Pill Tag -->
  <g transform="translate(470, 42)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#2563EB"/>
    <text x="136" y="18.5" text-anchor="middle" fill="#1D4ED8" font-size="12.5" font-weight="700" letter-spacing="0.4">DEEPSEEK HARNESS PLUGIN · v1.0</text>
  </g>

  <!-- Brand Title -->
  <text x="600" y="128" text-anchor="middle" fill="#0F172A" font-size="44" font-weight="800" letter-spacing="-0.8">
    Xiaobai-Research <tspan fill="#2563EB" font-weight="700" font-size="36">小白深度调研引擎</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="172" text-anchor="middle" fill="#475569" font-size="17.5" font-weight="500">
    让任何行业小白 5 分钟看懂陌生赛道 · 让业务决策者直接拿到「技术物理边界 + 自研/采购博弈清单」
  </text>

  <!-- Bottom 4 Minimalist Metric Pills -->
  <g transform="translate(150, 214)">
    <rect x="0" y="0" width="205" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="102.5" y="26" text-anchor="middle" fill="#0F172A" font-size="13.5" font-weight="600"><tspan fill="#2563EB" font-weight="800">120+ 份</tspan> 标杆报告蒸馏</text>

    <rect x="228" y="0" width="205" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="330.5" y="26" text-anchor="middle" fill="#0F172A" font-size="13.5" font-weight="600"><tspan fill="#0D9488" font-weight="800">5 分钟</tspan> 跨界小白破冰</text>

    <rect x="456" y="0" width="215" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="563.5" y="26" text-anchor="middle" fill="#0F172A" font-size="13.5" font-weight="600"><tspan fill="#2563EB" font-weight="800">97.1 分</tspan> ERQI 智库评测</text>

    <rect x="694" y="0" width="206" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="797" y="26" text-anchor="middle" fill="#0F172A" font-size="13.5" font-weight="600"><tspan fill="#0D9488" font-weight="800">100%</tspan> 公文 Word 直出</text>
  </g>
</svg>
